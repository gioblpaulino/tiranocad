<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiranoGio CAD - Painel de Engenharia</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1e1e1e; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; height: 100vh; overflow: hidden;
        }
        #visualizador-3d {
            width: 65%; height: 100%; position: relative;
        }
        #canvas-container { width: 100%; height: 100%; }
        #sidebar-engenharia {
            width: 35%; height: 100%;
            background-color: #252525;
            border-left: 2px solid #007acc;
            display: flex; flex-direction: column;
            box-sizing: border-box;
        }
        .header-sidebar {
            padding: 20px; border-bottom: 1px solid #444;
            background-color: #1d1d1d;
        }
        .header-sidebar h2 { margin: 0; font-size: 20px; color: #007acc; }
        .header-sidebar p { margin: 5px 0 0 0; font-size: 13px; color: #aaa; }
        .lista-componentes {
            flex-grow: 1; overflow-y: auto; padding: 15px;
        }
        .card-peca {
            background-color: #333; border: 1px solid #444;
            border-radius: 4px; padding: 12px; margin-bottom: 10px;
            cursor: pointer; transition: border-color 0.2s, background-color 0.2s;
        }
        .card-peca:hover { border-color: #007acc; background-color: #3a3a3a; }
        .card-peca.active { border-color: #ffaa00; background-color: rgba(255, 170, 0, 0.05); }
        .nome-peca { font-size: 14px; font-weight: bold; color: #ddd; margin-bottom: 4px; }
        .dimensoes-peca { font-size: 12px; color: #ffaa00; font-family: monospace; }
        .tag-categoria {
            display: inline-block; font-size: 10px; text-transform: uppercase;
            background: #007acc; color: white; padding: 2px 6px;
            border-radius: 10px; margin-top: 6px; font-weight: bold;
        }
        .instrucoes {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(0,0,0,0.7); padding: 8px 12px;
            border-radius: 4px; font-size: 11px; z-index: 5; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- CONTAINER DO HOLOGRAMA 3D -->
    <div id="visualizador-3d">
        <div class="instrucoes">🖱️ Rotate | ↕️ Zoom | 🔑 Duplo clique na peça: Interagir</div>
          <!-- 🚀 NOVO: PAINEL DE CONTROLE DE EXPLOSÃO -->
        <div id="painel-explosao" style="position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(0,0,0,0.8); padding: 12px 16px; border-radius: 6px; border: 1px solid #007acc; display: flex; align-items: center; gap: 10px;">
            <label for="range-explosao" style="font-size: 12px; color: #007acc; font-weight: bold; white-space: nowrap;">💥 Explosão 3D:</label>
            <input type="range" id="range-explosao" min="0" max="100" value="0" style="width: 130px; cursor: pointer;" oninput="atualizarExplosao(this.value)">
            <span id="lbl-explosao-val" style="font-size: 11px; color: #aaa; font-family: monospace; width: 35px;">0%</span>
            <button onclick="resetarExplosao()" style="background: #444; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 11px;">Reset</button>
        </div>

        <div id="canvas-container"></div>
    </div>

    <!-- SIDEBAR DA ÁRVORE DE COMPONENTES INDUSTRIAL -->
    <div id="sidebar-engenharia">
        <div class="header-sidebar">
            <h2 id="lbl-projeto">Carregando Módulo...</h2>
            <p id="lbl-detalhes">Dimensões Totais: --</p>
        </div>
        <div class="lista-componentes" id="container-lista">
            <!-- Injeção de componentes via JavaScript puro -->
        </div>

        <!-- PAINEL DO COPILOTO TIRANOGIO -->
        <div class="painel-copiloto" style="padding: 15px; border-top: 1px solid #444; background: #1a1a1a;">
          <label style="font-size: 12px; color: #007acc; font-weight: bold;">🤖 Copiloto TiranoGio</label>
          <div style="display: flex; gap: 5px; margin-top: 5px;">
            <input type="text" id="txt-comando-copiloto" placeholder="Ex: Divida ao meio e coloque 3 gavetas na esquerda..." 
                   style="flex-grow: 1; background: #333; border: 1px solid #555; color: white; padding: 8px; border-radius: 4px;">
            <button onclick="dispararCopiloto()" 
                    style="background: #007acc; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
              Enviar
            </button>
          </div>
        </div>
    </div>

    <script>

        // Garante a coerção para string limpa no front-end
        const ID_MODULO_ALVO = String("{{ id_modulo }}").trim();

        // 🚀 CORREÇÃO CRÍTICA: Aguarda o navegador calcular os tamanhos do container antes de disparar o Three.js
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof inicializarCenario === "function") {
                // Pequeno delay de segurança para garantir o cálculo correto de dimensões de flexbox
                setTimeout(() => {
                    inicializarCenario();
                }, 50);
            }
        });
    </script>
    <script src="/static/js/visualizador.js"></script>
    <script src="/static/js/copiloto.js"></script>

</body>
</html>
